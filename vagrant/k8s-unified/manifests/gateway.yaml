apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dev-k8s-local
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    hostname: dev.k8s.local
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    port: 443
    hostname: dev.k8s.local
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: dev-k8s-local-tls
    allowedRoutes:
      namespaces:
        from: All
